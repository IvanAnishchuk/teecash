# CRE secrets file.
#
# Each entry maps one secret ID to one environment variable. The workflow requests the
# secret ID with runtime.GetSecret(&cre.SecretRequest{Id: ...}).
#
# One secret holds the mint key for one denomination. The key that signs a point sets the
# denomination of that note. These secrets are therefore the mint itself. The Vault DON
# releases them into the attested enclave. Node operators never see them.
#
# Each value is a BLS12-381 scalar in hex, in the range 1 to order-1.

secretsNames:
  MINT_KEY_1_CENT:
    - SECRET_MINT_KEY_1_CENT
  MINT_KEY_10_CENT:
    - SECRET_MINT_KEY_10_CENT
  MINT_KEY_1_USDC:
    - SECRET_MINT_KEY_1_USDC
  MINT_KEY_10_USDC:
    - SECRET_MINT_KEY_10_USDC
  MINT_KEY_100_USDC:
    - SECRET_MINT_KEY_100_USDC
